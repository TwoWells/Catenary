---
name: Deploy Docs

"on":
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'docs/**'
      - 'schemas/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup mdBook
        run: |
          TAG=$(gh release view --repo rust-lang/mdBook \
            --json tagName -q .tagName)
          asset="mdbook-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/rust-lang/mdBook/releases/download"
          curl -sSL "$base/${TAG}/$asset" | tar xz
          echo "$PWD" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare site directory
        run: mkdir -p site/stable site/dev

      # Archive banner (October 2026): injected into BOTH builds so the
      # stable site (built from the last tag) carries it too.
      - name: Write archive banner assets
        run: |
          mkdir -p banner
          cat > banner/archived-banner.css <<'CSS'
          .archived-banner {
            background: #4a1d1d;
            color: #fff;
            text-align: center;
            padding: 0.5em;
            font-size: 0.9em;
            position: sticky;
            top: 0;
            z-index: 1001;
          }
          .archived-banner a { color: #fff; text-decoration: underline; }
          CSS
          cat > banner/archived-banner.js <<'JS'
          (function() {
            var banner = document.createElement('div');
            banner.className = 'archived-banner';
            banner.innerHTML = 'Catenary was archived in October 2026 and is no longer ' +
              'maintained. These docs describe the last release. ' +
              '<a href="https://github.com/TwoWells/Catenary#status-archived-october-2026">' +
              'Why, in the README.</a>';
            document.body.prepend(banner);
          })();
          JS
      - name: Build stable docs (latest tag)
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | head -1)
          echo "Building stable docs from $LATEST_TAG"
          git checkout "$LATEST_TAG" -- docs/
          cp banner/archived-banner.css banner/archived-banner.js docs/src/
          cat >> docs/book.toml <<'TOML'
          additional-css = ["src/archived-banner.css"]
          additional-js = ["src/archived-banner.js"]
          TOML
          mdbook build docs
          cp -r docs/book/* site/stable/
          git checkout HEAD -- docs/
          rm -f docs/src/archived-banner.css docs/src/archived-banner.js

      - name: Build dev docs (current ref)
        run: |
          cat > docs/src/dev-banner.css <<'CSS'
          .dev-banner {
            background: #d97706;
            color: #fff;
            text-align: center;
            padding: 0.5em;
            font-size: 0.9em;
            position: sticky;
            top: 0;
            z-index: 1000;
          }
          .dev-banner a { color: #fff; text-decoration: underline; }
          CSS
          cat > docs/src/dev-banner.js <<'JS'
          (function() {
            var banner = document.createElement('div');
            banner.className = 'dev-banner';
            banner.innerHTML = 'You are reading unreleased documentation. ' +
              '<a href="/stable/">Click here for the latest release.</a>';
            document.body.prepend(banner);
          })();
          JS
          cp banner/archived-banner.css banner/archived-banner.js docs/src/
          cat >> docs/book.toml <<'TOML'
          additional-css = ["src/dev-banner.css", "src/archived-banner.css"]
          additional-js = ["src/dev-banner.js", "src/archived-banner.js"]
          TOML
          mdbook build docs
          cp -r docs/book/* site/dev/
          git checkout HEAD -- docs/book.toml
          rm -f docs/src/dev-banner.css docs/src/dev-banner.js
          rm -f docs/src/archived-banner.css docs/src/archived-banner.js

      - name: Create root redirect
        run: |
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
            <head><meta http-equiv="refresh" content="0; url=stable/"></head>
            <body><a href="stable/">Redirecting to stable docs…</a></body>
          </html>
          HTML

      - name: Publish JSON Schemas
        # misc 133: serve the committed config schemas at the stable URLs the
        # `#:schema` directive and the SchemaStore entry reference
        # (https://twowells.github.io/catenary/schemas/*.json). Taken from the
        # current ref so the published schema always matches the shipped build.
        run: |
          mkdir -p site/schemas
          cp schemas/*.json site/schemas/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
